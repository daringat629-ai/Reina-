name: Build Marin from zip

# В репозитории лежит только архив marin-repo_v0.7.zip: сценарий сам распаковывает его, прогоняет тесты
# и собирает Марин с входом аккаунтом Telegram. Запуск: при загрузке архива или вручную (Run workflow).
on:
  workflow_dispatch:
  push:
    paths: ['*.zip', '.github/workflows/build-from-zip.yml']

concurrency:
  group: build-marin
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Unpack the archive
        run: |
          ZIP=$(for f in marin-repo*.zip; do printf '%s\t%s\n' "$(git log -1 --format=%ct -- "$f")" "$f"; done | sort -n | tail -n 1 | cut -f2-)
          echo "Archive: $ZIP"
          mkdir tree
          unzip -q "$ZIP" -d tree
          ls tree
      - name: Tests
        working-directory: tree
        run: go test ./...
      - name: Build with Telegram account login
        working-directory: tree
        env:
          CGO_ENABLED: "0"
        run: |
          # Если в архиве есть go.mod с gotd/td и go.sum, версия зафиксирована и берётся она. Иначе берётся свежая,
          # а итоговые go.mod/go.sum сохраняются в артефакт как pin-go.mod / pin-go.sum: положи их в архив как go.mod и go.sum.
          if grep -q 'github.com/gotd/td' go.mod && [ -f go.sum ]; then
            go mod download
          else
            go get github.com/gotd/td@latest
            go mod tidy
          fi
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -tags tguser -o ../marin-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -tags tguser -o ../marin-linux-arm64 .
          cp go.mod ../pin-go.mod
          cp go.sum ../pin-go.sum
          cd ..
          for f in marin-linux-amd64 marin-linux-arm64; do sha256sum "$f" > "$f.sha256"; done
          grep gotd/td pin-go.mod || true
          ls -la marin-linux-* pin-go.*
      - uses: actions/upload-artifact@v4
        with:
          name: marin-linux
          path: |
            marin-linux-*
            pin-go.mod
            pin-go.sum
      - name: Release latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest --title "Marin (account login build)" --notes "auto build" marin-linux-*
